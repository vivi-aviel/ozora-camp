<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F5F7">
<title>Ozora Camp – סיכום הזמנה</title>
<meta property="og:title" content="Ozora Camp – ההזמנה שלך אושרה ✅">
<meta property="og:description" content="פרטי ההזמנה, ניווט למתחם ולפסטיבל וכל מה שיש בסביבה.">
<meta property="og:image" content="https://vivi-aviel.github.io/ozora-camp/assets/img/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--bg:#F4F5F7;--brand:#4F46E5;--ok:#15803D;--ok-bg:#DCFCE7}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;padding:14px 16px}
.brand{font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:6px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.doc{max-width:640px;margin:0 auto 40px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.06)}
.cover{height:170px;background:url(assets/img/lake-sm.jpg) center/cover}
.head{padding:22px 22px 8px}
.status{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:14px;border-radius:999px;padding:5px 12px}
.head h1{font-size:26px;margin:12px 0 2px}
.head p{margin:0;color:var(--muted)}
.ref{font-size:13px;color:var(--muted);margin-top:6px}
.sec{padding:18px 22px;border-top:1px solid var(--line)}
.sec h2{font-size:15px;text-transform:none;letter-spacing:.2px;color:var(--muted);font-weight:600;margin:0 0 12px}
.rows{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px}
.row span:first-child{color:var(--muted)}
.row b{font-weight:600}
.nav{display:grid;gap:8px}
.nav a{display:flex;align-items:center;gap:10px;justify-content:space-between;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;min-height:52px}
.nav a small{color:var(--muted);font-weight:400}
.nav a .go{color:var(--brand);font-size:14px;white-space:nowrap}
.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.item:last-child{border-bottom:0}
.item .ic{flex:none;width:36px;height:36px;border-radius:10px;background:#EEF2FF;color:var(--brand);display:grid;place-items:center}
.item .tx{flex:1;min-width:0}.item b{display:block;font-weight:600;font-size:15px}.item small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.item .go{color:var(--brand);font-size:13.5px;font-weight:600;white-space:nowrap}
.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:12px 14px;font-size:14.5px}
.note ul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:4px}
.foot{padding:18px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot p{margin:0;color:var(--muted);font-size:14.5px}
.wa{background:#16A34A;color:#fff;border-radius:999px;padding:9px 16px;text-decoration:none;font-weight:700;font-size:14.5px}
.msg{max-width:640px;margin:40px auto;text-align:center;color:var(--muted);padding:0 20px}

/* compact layout */
.cover{height:110px}
.head{padding:16px 18px 6px}.head h1{font-size:21px;margin:8px 0 0}.head p{font-size:14px}
.sec{padding:14px 18px}.sec h2{margin:0 0 8px;font-size:14px}
.rows{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{flex-direction:column;gap:0;background:#F9FAFB;border-radius:10px;padding:8px 10px}
.row span:first-child{font-size:12px}.row b{font-size:15px}
.nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nav a{flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:10px 6px;min-height:64px;font-size:13.5px;line-height:1.25}
.nav a .go{display:none}.nav a small{display:block;font-size:12px}
.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;gap:8px}
.item .ic{width:28px;height:28px;border-radius:8px}
.item b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small,.item .go{display:none}
.note{font-size:13.5px;padding:10px 12px}.note ul{gap:2px}
.foot{padding:12px 18px}
@media print{body{background:#fff}.top .lang,.foot .wa{display:none}.doc{box-shadow:none}}
</style>
</head>
<body>
<div class="top"><a class="brand" href="./">Ozora Camp</a>
<div class="lang" role="group" aria-label="Language"><button data-l="he" aria-pressed="true">עב</button><button data-l="en" aria-pressed="false">EN</button></div></div>
<div id="app"><div class="msg" data-t="loading"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://agihjbqthsdcnandfxmm.supabase.co',SUPABASE_KEY='sb_publishable_ACfHU3z5UXEioXVqwsK4DQ_XGJyfDTx';
const LINKS={waze:'https://waze.com/ul?ll=46.758056,18.546444&navigate=yes',gm:'https://www.google.com/maps/dir/?api=1&destination=46.758056,18.546444',fest:'https://www.google.com/maps/search/?api=1&query=Ozora%20Gate'};
const T={he:{dir:'rtl',loading:'טוען את ההזמנה…',notFound:'לא מצאנו את ההזמנה. בדקו שהקישור מלא, או כתבו לנו בוואטסאפ.',title:'סיכום הזמנה',hi:'היי {n}, ההזמנה שלך מוכנה',confirmed:'ההזמנה אושרה ושולמה',thanks:'תודה! הנה כל מה שצריך לדעת לקראת ההגעה.',ref:'מספר הזמנה',details:'פרטי ההזמנה',nightsL:'לילות',place:'מיקום',until12:'עד 12:00 בצהריים',camp:'למתחם',fest:'לפסטיבל',toCamp:'ניווט למתחם',toFest:'ניווט לפסטיבל',festTime:'\u206610–12\u2069 דק׳ נסיעה',unit:'יחידה',room:'חדר',caravan:'קרוואן',guests:'אנשים',arrive:'הגעה',leave:'עזיבה',nights:'לילות',
navTitle:'ניווט',navWaze:'ניווט למתחם ב־Waze',navGm:'ניווט למתחם ב־Google Maps',navFest:'ניווט לפסטיבל (\u206610–12\u2069 דק׳)',around:'מה יש בסביבה (לחצו לניווט)',nav:'ניווט',
rulesTitle:'חשוב לזכור',rules:['עזיבת החדר עד 12:00 בצהריים.','רק מי שהזמין חדר נכנס למתחם. אין להזמין קרובים או חברים, גם לא להתקלח.','ארוחות במקום בתוספת תשלום. בכל חדר יש מאוורר.'],
contact:'שאלות? כתבו לנו בוואטסאפ.',pl0:'תחנת דלק עם מינימרקט, צמודה למתחם',pl1:'מאפייה ממש ליד המתחם, לחם ומאפים טריים בבוקר',pl2:'מסעדה הונגרית מומלצת מאוד',pl3:'קבב ואוכל מהיר, פתוח עד מאוחר',pl4:'מכולת למצרכים בסיסיים. כדאי לבדוק שעות, בסופ״ש נסגר מוקדם',pl5:'בר קטן ומקומי',pl6:'כספומט 24 שעות, ליד מוקד רפואה דחופה (Orvosi Ügyelet)'},
en:{dir:'ltr',loading:'Loading your booking…',notFound:"We couldn't find this booking. Check the link is complete, or message us on WhatsApp.",title:'Booking summary',hi:'Hi {n}, your stay is booked',confirmed:'Confirmed and paid',thanks:"Thank you! Here's everything you need for your arrival.",ref:'Booking no.',details:'Booking details',nightsL:'Nights',place:'Location',until12:'by 12:00 noon',camp:'To the camp',fest:'To the festival',toCamp:'Navigate to the camp',toFest:'Navigate to the festival',festTime:'10–12 min drive',unit:'Unit',room:'Room',caravan:'Caravan',guests:'People',arrive:'Arrival',leave:'Departure',nights:'nights',
navTitle:'Navigation',navWaze:'Navigate to the camp with Waze',navGm:'Navigate to the camp with Google Maps',navFest:'Navigate to the festival (10–12 min)',around:"What\'s nearby (tap to navigate)",nav:'Navigate',
rulesTitle:'Please remember',rules:['Check-out by 12:00 noon.','Only people who booked a room may enter the site – no relatives or friends, including for showers.','Meals on site for an extra charge. A fan in every room.'],
contact:'Questions? Message us on WhatsApp.',pl0:'Gas station with a mini-market, right next to the site',pl1:'Bakery right by the site – fresh bread and pastries in the morning',pl2:'Highly recommended Hungarian restaurant',pl3:'Kebab and fast food, open late',pl4:'Grocery for basics. Check opening hours – closes early on weekends',pl5:'Small local bar',pl6:'24-hour ATM, next to the urgent-care medical center (Orvosi Ügyelet)'}};
let lang='he',B=null,REF='';
const t=(k,v)=>{let s=T[lang][k]??T.en[k]??k;if(v&&typeof s==='string')for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=x=>{const [y,m,dd]=(x||'').split('-');return dd+'/'+m+'/'+y};
const nights=()=>Math.round((Date.parse(B.checkOut)-Date.parse(B.checkIn))/864e5);
const CARDS=`<a class="item" href="https://www.google.com/maps/search/?api=1&query=MOL%20Simontornya" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17M3 22h12M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3M6 8h6"/></svg></span><span class="tx"><b>MOL</b><small data-t="pl0"></small></span><span class="go" data-t="nav"></span></a>
<a class="item" href="https://www.google.com/maps/search/?api=1&query=P%C3%A9ks%C3%A9g%20Kabasi%20Simontornya" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11a4 4 0 0 1 0-8h14a4 4 0 0 1 0 8v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/></svg></span><span class="tx"><b>Pékség Kabasi</b><small data-t="pl1"></small></span><span class="go" data-t="nav"></span></a>
<a class="item" href="https://www.google.com/maps/search/?api=1&query=Tulip%C3%A1n%20%C3%89tterem%20Simontornya" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></span><span class="tx"><b>Tulipán Étterem</b><small data-t="pl2"></small></span><span class="go" data-t="nav"></span></a>
<a class="item" href="https://www.google.com/maps/search/?api=1&query=%C3%9Aton%C3%A1ll%C3%B3%20Kebab%20Simontornya" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></span><span class="tx"><b>Útonálló Kebab</b><small data-t="pl3"></small></span><span class="go" data-t="nav"></span></a>
<a class="item" href="https://www.google.com/maps/search/?api=1&query=mini%20Coop%20ABC%20Simontornya" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h3l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></span><span class="tx"><b>mini Coop ABC</b><small data-t="pl4"></small></span><span class="go" data-t="nav"></span></a>
<a class="item" href="https://www.google.com/maps/search/?api=1&query=K%C3%B6ny%C3%B6kl%C5%91%20B%C3%BCf%C3%A9%20Simontornya" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 22h8M12 11v11M19 3l-7 8-7-8z"/></svg></span><span class="tx"><b>Könyöklő Büfé</b><small data-t="pl5"></small></span><span class="go" data-t="nav"></span></a>
<a class="item" href="https://www.google.com/maps/search/?api=1&query=Simontornya%20Orvosi%20%C3%9Cgyelet%20OTP%20ATM" target="_blank" rel="noopener"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></span><span class="tx"><b>OTP ATM</b><small data-t="pl6"></small></span><span class="go" data-t="nav"></span></a>`;
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=t('dir');document.title='Ozora Camp – '+t('title');
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  const app=document.getElementById('app');
  if(B===null){app.innerHTML=`<div class="msg">${t('loading')}</div>`;return}
  if(B===false){app.innerHTML=`<div class="msg">${t('notFound')}</div>`;return}
  const unit=t(B.unitType==='caravan'?'caravan':'room')+' '+(B.unitNo||'');
  app.innerHTML=`<article class="doc">
  <div class="cover" role="img" aria-label="Ozora Camp"></div>
  <div class="head"><span class="status">✓ ${t('confirmed')}</span><h1>${esc(t('hi',{n:B.name||''}))}</h1><div class="ref">${t('ref')} <span class="num">${esc(REF)}</span></div></div>
  <section class="sec"><h2>${t('details')}</h2><div class="rows">
   <div class="row"><span>${t('unit')}</span><b>${esc(unit)}</b></div>
   <div class="row"><span>${t('guests')}</span><b class="num">${B.guests}</b></div>
   <div class="row"><span>${t('arrive')}</span><b class="num">${d(B.checkIn)}</b></div>
   <div class="row"><span>${t('leave')}</span><b><span class="num">${d(B.checkOut)}</span><small style="display:block;font-weight:500;font-size:12.5px;color:var(--muted)">${t('until12')}</small></b></div>
   <div class="row"><span>${t('nightsL')}</span><b class="num">${nights()}</b></div>
   <div class="row"><span>${t('place')}</span><b>Simontornya</b></div>
  </div></section>
  <section class="sec"><h2>${t('navTitle')}</h2><div class="nav">
   <a href="${LINKS.waze}" target="_blank" rel="noopener"><span>${t('camp')}<small>Waze</small></span><span class="go">${t('nav')} ←</span></a>
   <a href="${LINKS.gm}" target="_blank" rel="noopener"><span>${t('camp')}<small>Google Maps</small></span><span class="go">${t('nav')} ←</span></a>
   <a href="${LINKS.fest}" target="_blank" rel="noopener"><span>${t('fest')}<small>${t('festTime')}</small></span><span class="go">${t('nav')} ←</span></a>
  </div></section>
  <section class="sec"><h2>${t('around')}</h2><div class="list">${CARDS}</div></section>
  <section class="sec"><div class="note"><b>${t('rulesTitle')}</b><ul>${t('rules').map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div></section>
  <div class="foot"><p>${t('contact')}</p><a class="wa" href="https://wa.me/972526821668" target="_blank" rel="noopener">WhatsApp <span class="num">+972 52-682-1668</span></a></div>
  </article>`;
  app.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  if(lang==='en')app.querySelectorAll('.go').forEach(g=>g.textContent=t('nav')+' →');
}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
(async()=>{
  const id=new URLSearchParams(location.search).get('b')||'';
  if(!/^[0-9a-f-]{36}$/i.test(id)||!window.supabase){B=false;render();return}
  REF=id.slice(0,8).toUpperCase();
  try{const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data,error}=await sb.rpc('guest_summary',{p_id:id});
    if(error||!data){B=false}else{B=data;if(B.lang==='en')lang='en'}}catch(e){B=false}
  const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='he')lang=q;
  render();
})();
render();
</script>
