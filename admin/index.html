<title>Ozora Camp – ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --primary:#1E3A8A;--primary-2:#2D4FB0;--on-primary:#fff;
  --accent:#A16207;--accent-bg:#FEF3C7;
  --bg:#F5F7FB;--card:#fff;--fg:#0F172A;--muted:#475569;--muted-bg:#EEF2F7;--border:#DCE3EE;
  --ok:#15803D;--ok-bg:#DCFCE7;--warn:#B45309;--warn-bg:#FEF3C7;--bad:#B91C1C;--bad-bg:#FEE2E2;
  --room2:#DBEAFE;--room2-b:#2563EB;--room3:#E0E7FF;--room3-b:#4F46E5;--car:#FCE7F3;--car-b:#BE185D;
  --r:14px;--r-sm:10px;--s1:8px;--s2:12px;--s3:16px;--s4:24px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #93C5FD;outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--on-primary);padding:10px var(--s3);display:flex;align-items:center;gap:var(--s2)}
header.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 8px;min-height:36px}
header.top select option{color:var(--fg)}
.iconbtn{background:transparent;border:0;color:inherit;width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sub{background:#fff;border-bottom:1px solid var(--border);padding:8px var(--s3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:inline-flex;background:var(--muted-bg);border-radius:999px;padding:3px}
.chips button{border:0;background:transparent;padding:6px 12px;border-radius:999px;min-height:34px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed=true]{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
main{max-width:1100px;margin:0 auto;padding:var(--s3) var(--s3) 110px}
h2{font-size:20px;margin:4px 0 var(--s3)}
h3{font-size:16px;margin:0 0 var(--s2)}
.grid{display:grid;gap:var(--s2)}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--s3);box-shadow:var(--shadow)}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:start;width:100%;border:1px solid var(--border);background:#fff;border-radius:var(--r);padding:14px var(--s3);box-shadow:var(--shadow);transition:border-color .15s}
button.kpi:hover{border-color:var(--primary-2)}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .h{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:linear-gradient(135deg,var(--primary),#274BB5);color:#fff;border:0}
.kpi.hero .l,.kpi.hero .h{color:#DBE4FF}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:#FCD34D;border-radius:99px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:12px 14px;margin-bottom:var(--s3);font-size:14.5px}
.banner.warn{background:var(--warn-bg);color:#78350F;border:1px solid #FCD34D}
.banner.info{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE}
.banner button{margin-inline-start:auto}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:background .15s}
.btn:hover{background:var(--muted-bg)}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.p:hover{background:var(--primary-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#FCA5A5}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.list{display:grid;gap:10px}
.item{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;text-align:start;width:100%;box-shadow:var(--shadow)}
button.item:hover{border-color:var(--primary-2)}
.item .t{display:flex;gap:8px;align-items:center;font-weight:600}
.item .meta{font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;font-size:13.5px}
.money div{background:var(--muted-bg);border-radius:8px;padding:6px 8px}
.money b{display:block;font-size:15px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.room2{background:var(--room2);color:#1E40AF}.tag.room3{background:var(--room3);color:#3730A3}.tag.caravan{background:var(--car);color:#9D174D}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.mut{background:var(--muted-bg);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px}
.tw table.wide{min-width:560px}
.tw td:first-child{white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--fg)}
/* board */
.board{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:#fff}
.board table{width:auto;border-collapse:separate;border-spacing:0}
.board th,.board td{padding:0;border-bottom:1px solid var(--border);border-inline-start:1px solid #EEF2F7;height:46px;min-width:38px;text-align:center}
.board th{height:44px;font-size:11.5px;line-height:1.15;background:#FAFBFD;position:sticky;top:0}
.board .u{position:sticky;inset-inline-start:0;background:#fff;z-index:2;min-width:96px;padding:0 8px;text-align:start;font-weight:600;font-size:13.5px;white-space:nowrap}
.board th.u{z-index:3;background:#FAFBFD}
.board td.c{cursor:pointer}
.board td.c:hover{background:#F1F5FF}
.board td.bk{font-size:12px;font-weight:600;cursor:pointer;color:#0F172A;text-align:start;padding:0 6px}
.board td.bk .nm{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.board td.bk.room2{background:var(--room2);box-shadow:inset 0 -3px 0 var(--room2-b)}
.board td.bk.room3{background:var(--room3);box-shadow:inset 0 -3px 0 var(--room3-b)}
.board td.bk.caravan{background:var(--car);box-shadow:inset 0 -3px 0 var(--car-b)}
.board td.na{background:repeating-linear-gradient(45deg,#F1F5F9,#F1F5F9 6px,#E2E8F0 6px,#E2E8F0 12px)}
.board .wk{color:var(--muted);font-weight:500}
/* nav */
nav.bottom{position:fixed;bottom:0;inset-inline:0;z-index:30;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;min-height:56px;position:relative}
nav.bottom a[aria-current=page]{color:var(--primary)}
nav.bottom a[aria-current=page]::before{content:"";position:absolute;top:0;inset-inline:25%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.badge{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;bottom:78px;inset-inline-end:16px;z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(161,98,7,.35)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.ov{align-items:center}}
.dlg{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:var(--s3) var(--s3) calc(var(--s4) + env(safe-area-inset-bottom))}
@media(min-width:720px){.dlg{border-radius:18px}}
.dlg .hd{display:flex;align-items:center;gap:8px;margin-bottom:var(--s2);position:sticky;top:calc(-1 * var(--s3));background:#fff;padding-top:4px;z-index:1}
.dlg .hd h3{flex:1;margin:0;font-size:18px}
.dlg .hd .iconbtn{color:var(--muted)}
.f{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.fl{display:grid;gap:4px;font-size:13.5px;font-weight:600;color:#334155}
label.fl small{font-weight:400;color:var(--muted)}
.in{width:100%;border:1px solid #CBD5E1;border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}
.in:focus{border-color:var(--primary-2);outline:none;box-shadow:0 0 0 3px #DBEAFE}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px;min-height:44px}
.chk input{width:20px;height:20px}
.calc{background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:12px;padding:12px;font-size:14px;display:grid;gap:4px}
.calc .ln{display:flex;justify-content:space-between;gap:10px}
.calc .ln span:first-child{color:var(--muted)}
.calc .fx{font-size:12.5px;color:var(--muted);direction:ltr;text-align:end}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.warnt{color:var(--warn);font-size:13.5px;font-weight:600}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.sec{margin-top:var(--s4)}
details summary{cursor:pointer;font-weight:600;color:var(--primary);min-height:36px;display:flex;align-items:center}
textarea.in{min-height:80px}
pre.rep{white-space:pre-wrap;background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;font-family:inherit;max-height:300px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/*CALC-START*/
const DAY=86400000;
function pd(s){if(!s||typeof s!=='string')return null;const p=s.split('-').map(Number);if(p.length!==3||p.some(isNaN))return null;return Date.UTC(p[0],p[1]-1,p[2])}
function nightsBetween(a,b){const x=pd(a),y=pd(b);if(x==null||y==null)return 0;return Math.max(0,Math.round((y-x)/DAY))}
function addDays(s,n){const d=new Date(pd(s)+n*DAY);return d.toISOString().slice(0,10)}
function r2(n){return Math.round(n*100)/100}
function addMix(m,cur,v){v=Number(v);if(!isFinite(v)||!v)return m;m[cur]=r2((m[cur]||0)+v);return m}
function sumMix(a,b,sign){const o={...a};for(const c in b)addMix(o,c,(sign||1)*b[c]);return o}
function rates(s){return {EUR:1,ILS:+(s&&s.eurIls)||0,HUF:+(s&&s.eurHuf)||0}}
/* convert a {cur:amount} mix into one currency; null when a needed rate is missing (never assumes a rate) */
function convert(m,target,s){const r=rates(s);let tot=0;for(const c in m){const v=m[c];if(!v)continue;if(c===target){tot+=v;continue}if(!r[c]||!r[target])return null;tot+=v/r[c]*r[target]}return r2(tot)}
function unitKind(u){if(!u)return 'room2';return u.type==='caravan'?'caravan':(+u.capacity>=3?'room3':'room2')}
function calcBooking(b,u,s){
  const minN=+(s&&s.minNights)||7;
  const planned=nightsBetween(b.checkIn,b.checkOut);
  const actual=b.noShow?0:planned;
  const billable=Math.max(minN,planned);
  const g=+b.guests||0;
  const listRate=+b.listRate||0, katRate=+b.katRate||0;
  const listEUR=r2(g*billable*listRate);
  const katEUR=r2(b.katBasis==='unit'?actual*katRate:g*actual*katRate);
  const cur=b.currency||'EUR';
  const charged=addMix({},cur,b.charged), received=addMix({},cur,b.received);
  const outstanding=addMix({},cur,(+b.charged||0)-(+b.received||0));
  const profit=sumMix(received,{EUR:katEUR},-1);
  const chargedEUR=convert(charged,'EUR',s);
  const diffEUR=chargedEUR==null?null:r2(chargedEUR-listEUR);
  const commercial=!u||u.commercial!==false;
  return {planned,actual,billable,g,listRate,katRate,listEUR,katEUR,cur,charged,received,outstanding,profit,chargedEUR,diffEUR,commercial,minN};
}
function overlaps(a,b){return pd(a.checkIn)<pd(b.checkOut)&&pd(b.checkIn)<pd(a.checkOut)}
function seasonTotals(bookings,units,payouts,s){
  const um=Object.fromEntries(units.map(u=>[u.id,u]));
  const rows=[];let rev={},chg={},out={},kat=0,profit={},occ=0;
  for(const b of bookings){if(b.status!=='confirmed')continue;const u=um[b.unitId];const c=calcBooking(b,u,s);if(!c.commercial)continue;
    rows.push({b,u,c});rev=sumMix(rev,c.received);chg=sumMix(chg,c.charged);out=sumMix(out,c.outstanding);kat=r2(kat+c.katEUR);profit=sumMix(profit,c.profit);occ+=c.actual;}
  const paid=r2(payouts.reduce((a,p)=>a+(+p.amountEUR||0),0));
  const comUnits=units.filter(u=>u.commercial!==false).length;
  const days=s?nightsBetween(s.start,s.end):0;
  return {rows,rev,chg,out,kat,paid,katBal:r2(kat-paid),profit,occNights:occ,capNights:comUnits*days};
}
/*CALC-END*/

}

function freeUnitsFor(type,guests,ci,co,excludeId){
  const conf=S.bookings.filter(b=>b.status==='confirmed'&&b.id!==excludeId);

    if(type==='caravan'){if(u.type!=='caravan')return false}else{if(u.type==='caravan')return false;if(+u.capacity<(type==='room3'?3:2))return false}

  app.querySelectorAll('[data-uc]').forEach(x=>x.onchange=()=>{const u=unitById(x.dataset.uc);saveDoc('units',u.id,{...strip(u),capacity:+x.value})});
  app.querySelectorAll('[data-um]').forEach(x=>x.onchange=()=>{const u=unitById(x.dataset.um);saveDoc('units',u.id,{...strip(u),commercial:x.checked})});

const SF=[['name','seasonName','text'],['start','start','date'],['end','end','date'],['eurIls','eurIls','num'],['eurHuf','eurHuf','num'],['targetIls','targetIls','num'],['minNights','minNights','num'],['priceRoom','priceRoom','num'],['priceCar','priceCar','num'],['katRoom','katRoom','num'],['katCar','katCar','num'],['isPublic','pubSeason','bool']];
function seasonFields(s){return `<form class="f" id="sf"><div class="f2">${SF.filter(x=>x[2]!=='bool').map(([k,l,ty])=>`<label class="fl">${t(l)}<input class="in" name="${k}" type="${ty==='num'?'number':ty}" ${ty==='num'?'step="any" inputmode="decimal"':''} value="${esc(s[k]??'')}"></label>`).join('')}</div><label class="chk"><input type="checkbox" name="isPublic" ${s.isPublic?'checked':''}>${t('pubSeason')}</label><p class="small muted">${t('rateNote')}</p><div><button class="btn p" type="submit">${t('save')}</button></div></form>`}
function readSeasonForm(f){const o={};for(const [k,,ty] of SF){if(ty==='bool'){o[k]=f.elements[k].checked;continue}const v=f.elements[k].value.trim();o[k]=ty==='num'?(v===''?null:+v):v}return o}
function bindSeasonFields(s){document.getElementById('sf').onsubmit=async e=>{e.preventDefault();const o=readSeasonForm(e.target);if(!o.name)return;await saveDoc('seasons',s.id,{...strip(s),...o})}}
function newSeasonForm(){
  const s=season()||{};const y=new Date().getFullYear()+1;
  const base={name:'Ozora '+y,start:y+'-07-20',end:y+'-08-04',eurIls:s.eurIls??null,eurHuf:s.eurHuf??null,targetIls:s.targetIls??50000,minNights:s.minNights??7,priceRoom:s.priceRoom??80,priceCar:s.priceCar??50,katRoom:s.katRoom??25,katCar:s.katCar??15};
  modal(t('newSeason'),seasonFields(base),m=>{m.querySelector('#sf').onsubmit=async e=>{e.preventDefault();const o=readSeasonForm(e.target);if(!o.name)return;const id='s'+Date.now().toString(36);await saveDoc('seasons',id,o);curSeasonId=id;lsSet('oz_season',id);closeModal();render()}});
}

/* ===================== explain ===================== */
function explainTotal(kind){
  const s=season();const tot=seasonTotals(sBookings(),S.units,sPayouts(),s);
  const ratesTxt=`${s.eurIls?`1€ = ₪${s.eurIls}`:'—'}${s.eurHuf?` · 1€ = ${s.eurHuf} Ft`:''}`;
  let h=`<p class="small muted">${t('ruleLine')}</p>`;
  const lines=tot.rows.sort((a,b)=>(+a.u?.order||0)-(+b.u?.order||0)).map(({b,u,c})=>{
    let f;
    if(kind==='kat')f=b.katBasis==='unit'?`${c.actual} × €${c.katRate} = ${moneyTxt(c.katEUR,'EUR')}`:`${c.g} × ${c.actual} × €${c.katRate} = ${moneyTxt(c.katEUR,'EUR')}`;
    else if(kind==='rev')f=moneyTxt(+b.received||0,c.cur);
    else if(kind==='out')f=moneyTxt((+b.charged||0)-(+b.received||0),c.cur);
    else f=`${moneyTxt(+b.received||0,c.cur)} − ${moneyTxt(c.katEUR,'EUR')}`;
    return `<tr><td>${esc(u?.name)}</td><td class="fx num" style="direction:ltr">${esc(f)}</td></tr>`}).join('');
  const total=kind==='kat'?`${money(tot.kat,'EUR')} − ${t('katPaid')} ${money(tot.paid,'EUR')} = ${money(tot.katBal,'EUR')}`:showMix(kind==='rev'?tot.rev:kind==='out'?tot.out:tot.profit,s);
  const raw=kind==='rev'?tot.rev:kind==='out'?tot.out:kind==='kat'?{EUR:tot.katBal}:tot.profit;
  h+=`<table><tbody>${lines}</tbody><tfoot><tr><td>${t('total')}</td><td style="text-align:end">${total}</td></tr></tfoot></table>
  <div class="calc" style="margin-top:12px"><div class="ln"><span>${t('rateOf')}</span><span class="num">${esc(ratesTxt)}</span></div>
  ${Object.entries(raw).filter(([,v])=>v).map(([c,v])=>`<div class="ln"><span>${c}</span><span>${money(v,c)}</span></div>`).join('')}
  ${['ILS','EUR','HUF'].map(c=>`<div class="ln"><span>= ${c}</span><span>${money(convert(raw,c,s),c)}</span></div>`).join('')}
  ${!s.eurIls?`<div class="small warnt">${t('mixedNote')}</div>`:''}</div>`;
  modal(t('explain')+' – '+t({profit:'profit',rev:'revenue',kat:'katBal',out:'outCust'}[kind]),h);
}

/* ===================== modal / toast ===================== */
let lastFocus=null;
function modal(title,html,bind){lastFocus=document.activeElement;const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="hd"><h3 id="mt">${esc(title)}</h3><button class="iconbtn" id="mx" aria-label="${t('close')}">${icon('x')}</button></div>${html}</div></div>`;
  const ov=document.getElementById('ov');ov.onclick=e=>{if(e.target===ov)closeModal()};document.getElementById('mx').onclick=closeModal;
  if(bind)bind(ov);const first=ov.querySelector('input,select,textarea,button:not(#mx)');if(first)first.focus({preventScroll:true});}
function closeModal(){document.getElementById('modalRoot').innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
function confirmDlg(msg,fn){const root=document.getElementById('modalRoot');const prev=root.innerHTML;const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="ov" style="z-index:55"><div class="dlg" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn bad" id="cy">${t('del')}</button><button class="btn" id="cnn">${t('cancel')}</button></div></div></div>`;
  root.appendChild(wrap);wrap.querySelector('#cnn').onclick=()=>wrap.remove();wrap.querySelector('#cy').onclick=async()=>{wrap.remove();await fn()};wrap.querySelector('#cnn').focus();}
function toast(msg){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ===================== data ops ===================== */
const strip=o=>{const c={...o};delete c.id;return c};
const SPECIAL={start:'start_date',end:'end_date',order:'sort',amountEUR:'amount_eur',isPublic:'public'};
const REV=Object.fromEntries(Object.entries(SPECIAL).map(([a,b])=>[b,a]));
const toSnake=k=>SPECIAL[k]||k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());
const toCamel=k=>REV[k]||k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
function toDb(o){const r={};for(const k in o){let v=o[k];if(v===''||v===undefined)v=null;r[toSnake(k)]=v}return r}
function toApp(o){const r={};for(const k in o)r[toCamel(k)]=o[k];return r}
async function saveDoc(col,id,data,quiet){if(!sb){toast(t('noDb'));return false}
  const {error}=await sb.from(col).upsert(toDb({...data,id}));
  if(error){console.error(error);toast(t('saveErr')+' ('+(error.message||error.code)+')');return false}
  if(!quiet){toast(t('saved'));await reload()}return true}
async function delDoc(col,id){if(!sb)return;const {error}=await sb.from(col).delete().eq('id',id);if(error){toast(t('saveErr'));return}toast(t('deleted'));await reload()}
async function reload(){
  if(!sb||!session)return;
  try{
    const res=await Promise.all(['seasons','units','bookings','payouts'].map(c=>sb.from(c).select('*')));
    const bad=res.find(r=>r.error);if(bad)throw bad.error;
    ['seasons','units','bookings','payouts'].forEach((c,i)=>{S[c]=res[i].data.map(toApp);S.got[c]=true});
    S.err=null;
    if(!S.seasons.find(s=>s.id===curSeasonId)&&S.seasons.length){curSeasonId=([...S.seasons].find(s=>s.isPublic)||[...S.seasons].sort((a,b)=>(b.start||'').localeCompare(a.start||''))[0]).id}
  }catch(e){console.error(e);S.err='load'}
  render();
}
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
async function save(filename,data){try{const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/json';const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast(t('dlNA'))}}
function exportBookingsCsv(){const s=season();
  const head=['unit','type','names','phone','guests','check_in','check_out','actual_nights','billable_nights','no_show','currency','charged','received','outstanding','list_price_eur','katalin_rate_eur','katalin_basis','katalin_eur','profit_eur','profit_ils','paid_date','method','note'];
  const rows=sBookings().filter(b=>b.status==='confirmed').map(b=>{const u=unitById(b.unitId);const c=calcBooking(b,u,s);
    return [u?.name,unitKind(u),b.names,b.phone,c.g,b.checkIn,b.checkOut,c.actual,c.billable,b.noShow?'yes':'',c.cur,b.charged,b.received,r2((+b.charged||0)-(+b.received||0)),c.listEUR,c.katRate,b.katBasis,c.katEUR,c.commercial?convert(c.profit,'EUR',s)??'':'',c.commercial?convert(c.profit,'ILS',s)??'':'',b.paidDate,b.method,b.note]});
  save(`ozora-bookings-${s.name.replace(/\W+/g,'-')}.csv`,csv([head,...rows]));}
function exportKatalinCsv(){const s=season();const rows=katalinRows().map(({b,u,c})=>[u?.name,repNames?b.names:'',b.checkIn,b.checkOut,b.katBasis==='unit'?'':c.g,c.actual,c.katRate,b.katBasis==='unit'?'per unit/night':'per person/night',c.katEUR]);
  const tot=seasonTotals(sBookings(),S.units,sPayouts(),s);
  save(`katalin-${s.name.replace(/\W+/g,'-')}.csv`,csv([['unit','guests_names','check_in','check_out','guests','nights','rate_eur','basis','amount_eur'],...rows,[],['total','','','','','','','',tot.kat],['paid','','','','','','','',tot.paid],['balance','','','','','','','',tot.katBal]]));}
function backup(){const data={app:'ozora-camp',version:1,exportedAt:new Date().toISOString(),seasons:S.seasons,units:S.units,bookings:S.bookings,payouts:S.payouts};
  save(`ozora-backup-${today()}.json`,JSON.stringify(data,null,1));}
document.getElementById('restoreFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  let data;try{data=JSON.parse(await file.text())}catch(x){toast('JSON?');return}
  if(!data||data.app!=='ozora-camp'){toast('JSON?');return}
  confirmDlg(t('restoreQ'),async()=>{let n=0;for(const col of ['seasons','units','bookings','payouts'])for(const d of (data[col]||[])){if(!d||!d.id)continue;if(await saveDoc(col,String(d.id),strip(d),true))n++}toast(t('restored',{n}));await reload()});
};

/* ===================== boot ===================== */
document.getElementById('langSel').onchange=e=>{lang=e.target.value;lsSet('oz_lang',lang);render()};
document.getElementById('seasonSel').onchange=e=>{curSeasonId=e.target.value;lsSet('oz_season',curSeasonId);render()};
document.getElementById('subbar').onclick=e=>{const b=e.target.closest('[data-cur]');if(b){dispCur=b.dataset.cur;lsSet('oz_cur',dispCur);render()}};
document.getElementById('fab').onclick=()=>{const r=route();if(r==='requests')requestForm();else bookingForm()};
document.getElementById('app').addEventListener('click',e=>{const x=e.target.closest('[data-b]');if(x){const b=S.bookings.find(b=>b.id===x.dataset.b);if(b)bookingForm(b)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalRoot').innerHTML)closeModal()});
window.addEventListener('hashchange',()=>{closeModal();render()});
render();
async function onSession(sess){
  booting=false;session=sess;isAdmin=null;
  if(!session){render();return}
  const {data,error}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  isAdmin=!!(data&&!error);
  if(isAdmin){await reload();await loadVisits();render()}else render();
}
(async()=>{
  if(!window.supabase){booting=false;S.err='nodb';render();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data}=await sb.auth.getSession();
  await onSession(data.session);
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_OUT'){session=null;render()}});
  setInterval(async()=>{if(session&&isAdmin&&document.visibilityState==='visible'&&!document.getElementById('modalRoot').innerHTML){await loadVisits();reload()}},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&isAdmin)reload()});
})();
</script>
