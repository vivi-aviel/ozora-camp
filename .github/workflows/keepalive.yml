name: Keep database awake
# Supabase pauses free projects after a week without activity.
# This pings the database every 3 days so it stays awake all year.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://agihjbqthsdcnandfxmm.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_ACfHU3z5UXEioXVqwsK4DQ_XGJyfDTx" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
