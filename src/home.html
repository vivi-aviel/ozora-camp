<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozora Camp – לינה וקרוואנים לפסטיבל אוזורה</title>
<meta name="theme-color" content="#F6F7F3">
<meta name="description" content="לינה ליד פסטיבל אוזורה בהונגריה: חדרים וקרוואנים במתחם על שפת אגם וקרוואנים ממונעים להשכרה.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vivi-aviel.github.io/ozora-camp/">
<meta property="og:title" content="Ozora Camp – לינה ליד פסטיבל אוזורה">
<meta property="og:description" content="חדרים וקרוואנים במתחם וקרוואנים ממונעים להשכרה – 10–12 דקות מהפסטיבל.">
<meta property="og:image" content="https://vivi-aviel.github.io/ozora-camp/assets/img/share6.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22302B;--muted:#6E7B74;--line:#DDE3DC;--sand:#F6F7F3;--sage:#4E6B5C;--sage-bg:#E9EEE8;--r:20px}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--sand);color:var(--ink);font-family:Heebo,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;font-size:17px;line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
/* header */
.bar{position:fixed;top:0;inset-inline:0;z-index:40;color:#fff;transition:background .25s,box-shadow .25s}
.bar.solid{background:rgba(246,247,243,.96);color:var(--ink);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(8px)}
.bar .in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1080px;margin:0 auto}
.brand{font-weight:500;letter-spacing:2px;font-size:16px;direction:ltr;text-decoration:none;flex:1}
.lang{display:inline-flex;border:1px solid currentColor;border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:inherit;font:inherit;font-size:14px;padding:6px 12px;min-height:36px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink)}
.bar.solid .lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;max-width:1080px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;font-size:14.5px;font-weight:500;padding:7px 15px;border-radius:999px;border:1px solid #fff;background:#fff;color:var(--ink);white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar.solid .cats a{border-color:var(--line)}
.cats a[aria-current=page]{background:var(--sage);color:#fff;border-color:var(--sage)}
/* hero */
.hero{position:relative;min-height:62vh;min-height:62svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%)}
.hero .wrap{position:relative;z-index:1;padding-bottom:36px;width:100%}
.eyebrow{display:inline-block;font-size:12.5px;letter-spacing:1.5px;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 12px}
.hero h1{font-size:clamp(40px,9vw,72px);line-height:1.02;margin:12px 0 8px;font-weight:300;letter-spacing:-1.5px}
.hero p{font-size:clamp(17px,2.6vw,20px);max-width:620px;margin:0}
/* categories */
main{padding:32px 0 48px}
h2{font-weight:300;letter-spacing:-1px;font-size:clamp(28px,6vw,38px);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border-radius:var(--r);box-shadow:0 10px 30px rgba(34,48,43,.08);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(34,48,43,.12)}
.card .ph{aspect-ratio:4/3;overflow:hidden;position:relative;background:var(--sage-bg)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .badge{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.94);color:var(--ink);font-size:13px;font-weight:500;border-radius:999px;padding:4px 10px}
.card .bd{padding:16px 18px 18px;display:grid;gap:6px;flex:1}
.card h3{margin:0;font-size:22px;font-weight:400;letter-spacing:-.3px}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.card .go{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--sage)}
.card.soon{opacity:.85}
.ph.ico{display:flex;align-items:center;justify-content:center;color:var(--sage)}
.card.soon .ph img{filter:grayscale(.6)}
.card.soon .go{color:var(--muted)}
[dir=rtl] .go svg{transform:scaleX(-1)}
.strip{margin-top:28px;background:#fff;border-radius:var(--r);padding:18px 20px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(34,48,43,.06)}
@media(min-width:760px){.strip{grid-template-columns:repeat(3,1fr)}}
.strip div{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.strip svg{flex:none;color:var(--sage);margin-top:3px}
.strip b{display:block;font-weight:500}
footer{border-top:1px solid var(--line);padding:22px 0 36px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.wa{display:inline-flex;align-items:center;gap:8px;background:#1E8E3E;color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:500}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="in">
    <a class="brand" href="index.html">Ozora Camp</a>
    <div class="lang" role="group" aria-label="Language"><button data-l="he" aria-pressed="true">עב</button><button data-l="en" aria-pressed="false">EN</button></div>
  </div>
  <nav class="cats" aria-label="categories">
    <a href="index.html" aria-current="page" data-t="nHome"></a>
    <a href="camp.html" data-t="nCamp"></a>

<div class="hero">

    <span class="eyebrow" data-t="eyebrow"></span>
    <h1>Ozora Camp</h1>
    <p data-t="heroText"></p>

<main class="wrap">

  <p class="lead" data-t="catLead"></p>
  <div class="grid">
    <a class="card" href="camp.html">
      <div class="ph"><img src="assets/img/compound-sm.jpg" alt="" loading="lazy"><span class="badge" data-t="b1"></span></div>

    </a>
  </div>

  <div class="strip">
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span><b data-t="s1t"></b><span data-t="s1"></span></span></div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg><span><b data-t="s2t"></b><span data-t="s2"></span></span></div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span><b data-t="s3t"></b><span data-t="s3"></span></span></div>
  </div>
</main>

<footer><div class="wrap"><span data-t="foot"></span><a class="wa" id="wa" target="_blank" rel="noopener"><span data-t="waBtn"></span></a></div></footer>
